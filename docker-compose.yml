# Before the first start, create the data folder as your user:
#   mkdir -p data
# (If Docker creates it, it is owned by root and fsend cannot write to it.)
services:
  fsend:
    image: ghcr.io/fsend-me/fsend:latest
    container_name: fsend
    restart: unless-stopped
    # Runs as your host user so ./data stays owned by you (see `id -u` / `id -g`).
    user: "${FSEND_UID:-1000}:${FSEND_GID:-1000}"
    ports:
      - "${FSEND_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
