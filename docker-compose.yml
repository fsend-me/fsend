services:
  # One-shot helper: Docker creates a missing ./data owned by root, so hand it
  # (and anything in it) to the user fsend runs as, then exit.
  fsend-init:
    image: busybox:1.37
    user: "0:0"
    command: ["chown", "-R", "${FSEND_UID:-1000}:${FSEND_GID:-1000}", "/data"]
    volumes:
      - ./data:/data
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt:
      - no-new-privileges:true
    restart: "no"

  fsend:
    image: ghcr.io/fsend-me/fsend:latest
    container_name: fsend
    restart: unless-stopped
    depends_on:
      fsend-init:
        condition: service_completed_successfully
    # Runs as your host user so ./data stays owned by you (see `id -u` / `id -g`).
    user: "${FSEND_UID:-1000}:${FSEND_GID:-1000}"
    ports:
      - "${FSEND_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
